name: Publish debug APK

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build workflow run ID that uploaded debug-apk
        required: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Attach debug APK to Releases
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debug-apk
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: debug-latest
          name: Debug APK (Android 11+)
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Sideload debug APK from the latest successful Build on `main`.

            - minSdk 30 (Android 11 and newer)
            - arm64-v8a
            - debug-signed, not the Play-store release key

            Replaces the previous `debug-latest` assets on each green Build.
          files: |
            artifacts/**/*.apk
