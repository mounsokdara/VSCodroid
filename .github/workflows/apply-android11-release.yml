name: Apply Android 11 release publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Restore gradle and publish path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore gradle, minSdk 30, API 30 helper, release publish
        run: |
          set -euo pipefail
          git checkout 650b0a42e61f9cfbc786bf5f98a0e281b55d06dd -- android/app/build.gradle.kts
          python3 <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()
          if "minSdk = 30" not in text:
              if "minSdk = 33" not in text:
                  raise SystemExit("minSdk assignment not found")
              text = text.replace("minSdk = 33", "minSdk = 30", 1)
              p.write_text(text)
          print("minSdk line:", next(ln for ln in text.splitlines() if "minSdk" in ln))
          PY
          python3 <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/kotlin/com/vscodroid/storage/SafSyncEngine.kt")
          text = p.read_text()
          if "fun InputStream.readAtMost" not in text:
              needle = "import java.io.FileOutputStream\n"
              if needle not in text:
                  raise SystemExit("SafSyncEngine import needle missing")
              text = text.replace(needle, "import java.io.FileOutputStream\nimport java.io.InputStream\n", 1)
              helper = """
          /** InputStream.readNBytes(buf, off, len) is API 33. This matches it on API 30. */
          private fun InputStream.readAtMost(buffer: ByteArray, offset: Int, length: Int): Int {
              var total = 0
              while (total < length) {
                  val n = read(buffer, offset + total, length - total)
                  if (n <= 0) break
                  total += n
              }
              return total
          }

          """
              class_needle = "/**\n * Bidirectional sync engine"
              if class_needle not in text:
                  raise SystemExit("SafSyncEngine class needle missing")
              text = text.replace(class_needle, helper + class_needle, 1)
              text = text.replace("readNBytes(", "readAtMost(")
              p.write_text(text)
          print("readAtMost", text.count("readAtMost"), "readNBytes", text.count("readNBytes"))
          PY
          python3 <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/build.yml")
          text = p.read_text()
          text = text.replace(
              "Neither job here publishes anything",
              "The build and test jobs do not publish",
              1,
          )
          if "publish-debug-apk:" not in text:
              extra = """

            # Workflow artifacts expire. The Releases page is where a sideloaded APK
            # can be downloaded later. This job attaches the debug APK from the Build
            # job above; it does not replace release.yml, which still publishes signed
            # artifacts when a v* tag is pushed with signing secrets.
            publish-debug-apk:
              name: Publish debug APK
              runs-on: ubuntu-latest
              needs: build
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              permissions:
                contents: write
              steps:
                - name: Download debug APK
                  uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                  with:
                    name: debug-apk
                    path: artifacts

                - name: Publish to GitHub Releases
                  uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
                  with:
                    tag_name: debug-latest
                    name: Debug APK (Android 11+)
                    prerelease: true
                    make_latest: true
                    fail_on_unmatched_files: true
                    body: |
                      Sideload debug APK from the latest successful Build on `main`.

                      - minSdk 30 (Android 11 and newer)
                      - arm64-v8a
                      - debug-signed, not the Play-store release key

                      Replaces the previous `debug-latest` assets on each push to `main`.
                    files: |
                      artifacts/**/*.apk
          """
              p.write_text(text.rstrip() + extra + "\n")
          else:
              p.write_text(text)
          print("publish job present", "publish-debug-apk:" in Path(".github/workflows/build.yml").read_text())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle.kts \
            android/app/src/main/kotlin/com/vscodroid/storage/SafSyncEngine.kt \
            .github/workflows/build.yml
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "build: Android 11+ minSdk and publish debug APK to Releases"
          git push
